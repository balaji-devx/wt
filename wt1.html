<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .calculator {
        background: #fff;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 320px;
      }
      h2 {
        text-align: center;
        margin: 0 0 20px 0;
        color: #333;
      }
      .input-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #666;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
      }
      input[readonly] {
        background: #eee;
        font-weight: bold;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 20px 0;
      }
      button {
        padding: 12px;
        border: none;
        border-radius: 20px;
        color: white;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.2s;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .op-button {
        background-color: #4caf50;
      }
      .op-button:hover {
        background-color: #45a049;
      }
      .clear-button {
        background-color: #f44336;
        grid-column: span 2;
      }
      .clear-button:hover {
        background-color: #da190b;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>Simple Calculator</h2>

      <div class="input-group">
        <label for="num1">First Number:</label>
        <input type="number" id="num1" oninput="autoCalculateSum()" required />
      </div>

      <div class="input-group">
        <label for="num2">Second Number:</label>
        <input type="number" id="num2" oninput="autoCalculateSum()" required />
      </div>

      <div class="buttons">
        <button class="op-button" onclick="calculate('add')">Add</button>
        <button class="op-button" onclick="calculate('subtract')">
          Subtract
        </button>
        <button class="op-button" onclick="calculate('multiply')">
          Multiply
        </button>
        <button class="op-button" onclick="calculate('divide')">Divide</button>
        <button class="clear-button" onclick="clearFields()">Clear</button>
      </div>

      <div class="input-group">
        <label for="result">Result:</label>
        <input type="text" id="result" readonly />
      </div>
    </div>

    <script>
      function autoCalculateSum() {
        const val1 = document.getElementById("num1").value;
        const val2 = document.getElementById("num2").value;

        if (val1 !== "" && val2 !== "") {
          const sum = parseFloat(val1) + parseFloat(val2);
          document.getElementById("result").value = sum;
        } else {
          document.getElementById("result").value = "";
        }
      }

      function calculate(operation) {
        const val1 = document.getElementById("num1").value;
        const val2 = document.getElementById("num2").value;

        if (val1 === "" || val2 === "") {
          alert("Please enter both numbers before calculating.");
          return;
        }

        const a = parseFloat(val1);
        const b = parseFloat(val2);
        let result;

        switch (operation) {
          case "add":
            result = a + b;
            break;
          case "subtract":
            result = a - b;
            break;
          case "multiply":
            result = a * b;
            break;
          case "divide":
            if (b === 0) {
              alert("Error: Cannot divide by zero.");
              return;
            }
            result = a / b;
            break;
        }
        document.getElementById("result").value = result;
      }

      function clearFields() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("result").value = "";
      }
    </script>
  </body>
</html>
