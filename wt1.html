<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>
    <script src="./style/js/wt1.js"></script>
    <link rel="stylesheet" href="./style/css/wt1.css">
  </head>
  <body>
    <div class="calculator">
      <h2>Simple Calculator</h2>

      <div class="input-group">
        <label for="num1">First Number:</label>
        <input type="number" pattern="[0-9]" id="num1" oninput="autoCalculateSum()" required />
      </div>

      <div class="input-group">
        <label for="num2">Second Number:</label>
        <input type="number" pattern="[0-9]" id="num2" oninput="autoCalculateSum()" required />
      </div>

      <div class="buttons">
        <button class="op-button" onclick="calculate('add')">Add</button>
        <button class="op-button" onclick="calculate('subtract')">Subtract</button>
        <button class="op-button" onclick="calculate('multiply')">
          Multiply
        </button>
        <button class="op-button" onclick="calculate('divide')">Divide</button>
        <button class="clear-button" onclick="clearFields()">Clear</button>
      </div>

      <div class="input-group">
        <label for="result">Result:</label>
        <input type="text" id="result" readonly />
      </div>
    </div>
  </body>
</html>
